name: Check Heilbronn ABH appointments

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: abh-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble

    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt

      - name: Check appointments
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python appointment_checker.py

      - name: Save appointment state
        run: |
          if [ -f appointment_state.json ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f appointment_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update appointment state [skip ci]'
              git push
            fi
          fi